syntax = "proto3";

package society.core.v1;

service UserService {
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc ListUsers (Empty) returns (ListUsersResponse);
  rpc GetUser (GetByIdRequest) returns (UserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser (GetByIdRequest) returns (UserResponse);
  rpc ListUserRoles (GetByIdRequest) returns (UserRolesResponse);
  rpc AssignRole (AssignRoleRequest) returns (AssignRoleResponse);
  rpc RemoveRole (RemoveRoleRequest) returns (RemoveResponse);
}

service RoleService {
  rpc CreateRole (CreateRoleRequest) returns (RoleResponse);
  rpc ListRoles (Empty) returns (ListRolesResponse);
  rpc GetRole (GetByIdRequest) returns (RoleDetailResponse);
  rpc UpdateRole (UpdateRoleRequest) returns (RoleDetailResponse);
  rpc DeleteRole (GetByIdRequest) returns (RemoveResponse);
  rpc ListRolePermissions (GetByIdRequest) returns (RolePermissionsResponse);
  rpc AssignPermission (AssignPermissionRequest) returns (AssignPermissionResponse);
  rpc RemovePermission (RemovePermissionRequest) returns (RemoveResponse);
}

service PermissionService {
  rpc CreatePermission (CreatePermissionRequest) returns (PermissionResponse);
  rpc ListPermissions (Empty) returns (ListPermissionsResponse);
  rpc GetPermission (GetByIdRequest) returns (PermissionResponse);
  rpc UpdatePermission (UpdatePermissionRequest) returns (PermissionResponse);
  rpc DeletePermission (GetByIdRequest) returns (RemoveResponse);
}

service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc Me (MeRequest) returns (UserResponse);
  rpc Refresh (RefreshRequest) returns (AuthResponse);
  rpc Logout (RefreshRequest) returns (LogoutResponse);
  rpc LogoutAll (MeRequest) returns (LogoutResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (MessageResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (MessageResponse);
  rpc SendOtp (SendOtpRequest) returns (OtpSendResponse);
  rpc VerifyOtp (VerifyOtpRequest) returns (VerifyOtpResponse);
}

message Empty {}

message RegisterRequest {
  string email = 1;
  string phone_number = 2;
  string password = 3;
  string first_name = 4;
  string last_name = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message MeRequest {
  string access_token = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message SendOtpRequest {
  string phone_number = 1;
  string purpose = 2;
  string access_token = 3;
}

message VerifyOtpRequest {
  string phone_number = 1;
  string purpose = 2;
  string code = 3;
  string new_password = 4;
  string access_token = 5;
}

message AuthResponse {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
  UserResponse user = 4;
  string refresh_token = 5;
}

message LogoutResponse {
  bool revoked = 1;
  int32 revoked_count = 2;
}

message MessageResponse {
  string message = 1;
}

message OtpSendResponse {
  string message = 1;
  int32 expires_in = 2;
}

message VerifyOtpResponse {
  bool verified = 1;
  string message = 2;
  AuthResponse auth = 3;
  bool has_auth = 4;
}

message GetByIdRequest {
  string uid = 1;
}

message RemoveResponse {
  bool removed = 1;
  string uid = 2;
}

message RoleSummary {
  string uid = 1;
  string name = 2;
  string description = 3;
}

message UserResponse {
  string uid = 1;
  string email = 2;
  string phone_number = 3;
  string first_name = 4;
  string last_name = 5;
  bool is_active = 6;
  string last_login = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated RoleSummary roles = 10;
  repeated string permissions = 11;
}
message CreateUserRequest {
  string email = 1;
  string phone_number = 2;
  string password = 3;
  string first_name = 4;
  string last_name = 5;
  bool is_active = 6;
  bool has_is_active = 7;
}

message UpdateUserRequest {
  string uid = 1;
  string email = 2;
  string phone_number = 3;
  string password = 4;
  string first_name = 5;
  string last_name = 6;
  bool is_active = 7;
  bool has_email = 8;
  bool has_phone_number = 9;
  bool has_password = 10;
  bool has_first_name = 11;
  bool has_last_name = 12;
  bool has_is_active = 13;
  bool clear_phone_number = 14;
}

message ListUsersResponse {
  repeated UserResponse users = 1;
}

message AssignRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message RemoveRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message AssignRoleResponse {
  string uid = 1;
  string assigned_at = 2;
  string user_id = 3;
  string role_id = 4;
}

message UserRoleItem {
  string uid = 1;
  string assigned_at = 2;
  RoleSummary role = 3;
}

message UserRolesResponse {
  repeated UserRoleItem items = 1;
}

message RoleResponse {
  string uid = 1;
  string name = 2;
  string description = 3;
  string created_at = 4;
}

message RoleDetailResponse {
  string uid = 1;
  string name = 2;
  string description = 3;
  string created_at = 4;
  repeated PermissionResponse permissions = 5;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
}

message UpdateRoleRequest {
  string uid = 1;
  string name = 2;
  string description = 3;
  bool has_name = 4;
  bool has_description = 5;
  bool clear_description = 6;
}

message ListRolesResponse {
  repeated RoleResponse roles = 1;
}

message PermissionResponse {
  string uid = 1;
  string action = 2;
  string module = 3;
  string description = 4;
}

message CreatePermissionRequest {
  string action = 1;
  string module = 2;
  string description = 3;
}

message UpdatePermissionRequest {
  string uid = 1;
  string action = 2;
  string module = 3;
  string description = 4;
  bool has_action = 5;
  bool has_module = 6;
  bool has_description = 7;
  bool clear_description = 8;
}

message ListPermissionsResponse {
  repeated PermissionResponse permissions = 1;
}

message AssignPermissionRequest {
  string role_id = 1;
  string permission_id = 2;
}

message RemovePermissionRequest {
  string role_id = 1;
  string permission_id = 2;
}

message AssignPermissionResponse {
  string uid = 1;
  string assigned_at = 2;
  string role_id = 3;
  string permission_id = 4;
}

message RolePermissionItem {
  string uid = 1;
  string assigned_at = 2;
  PermissionResponse permission = 3;
}

message RolePermissionsResponse {
  repeated RolePermissionItem items = 1;
}

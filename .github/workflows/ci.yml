name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Test / build (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared config
        run: npm run build --workspace=@society/nest-config

      - name: Unit tests
        run: |
          npm run test --workspace=service-core
          npm run test --workspace=gateway-bff

      - name: Build apps
        run: |
          npm run build --workspace=service-core
          npm run build --workspace=gateway-bff
          npm run build --workspace=service-realtime
          npm run build --workspace=frontend-nextjs

      - name: Typecheck realtime
        run: npm run lint --workspace=service-realtime

  analytics:
    name: Analytics (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/service-analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/service-analytics/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Import check
        run: python -c "from app.main import app; print(app.title)"
